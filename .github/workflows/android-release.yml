name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release signing key (optional)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.keystore"
              echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "Release signing key restored"
          else
            echo "No release signing key secret; debug build will be used"
            echo "RELEASE_MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Unit tests (app)
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint (app)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build APKs
        run: |
          if [[ "${RELEASE_MODE}" == "debug" ]]; then
            echo "Building debug APKs (no release signing key)"
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            echo "Building signed release APKs"
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Verify APK integrity (Medit classic)
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/34.0.0"
          if [[ "${RELEASE_MODE}" == "debug" ]]; then
            APK=app/build/outputs/apk/debug/app-debug.apk
          else
            APK=app/build/outputs/apk/release/app-release.apk
          fi
          test -f "${APK}"
          "${BUILD_TOOLS}/zipalign" -c 4 "${APK}"
          if [[ "${RELEASE_MODE}" != "debug" ]]; then
            "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | tee /dev/stderr | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
            "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          fi
          test -n "$(unzip -l "${APK}" | awk '/META-INF\/MANIFEST.MF/')"
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
          echo "${BADGING}" | head -3
          echo "${BADGING}" | grep -q "^package: name='com.medit.midi'"

      - name: Prepare release artifacts
        id: artifact
        run: |
          set -euo pipefail
          APP_VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          APP_NAME="Medit-${APP_VERSION_NAME}-${SUFFIX}.apk"
          if [[ "${RELEASE_MODE}" == "debug" ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk "dist/${APP_NAME}"
          else
            cp app/build/outputs/apk/release/app-release.apk "dist/${APP_NAME}"
          fi
          (cd dist && sha256sum "${APP_NAME}" > "${APP_NAME}.sha256")
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_apk=dist/${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_sha256=dist/${APP_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "app_signed=${RELEASE_MODE}" >> "$GITHUB_OUTPUT"
          echo "Prepared ${APP_NAME}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medit-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            MeditDAW の Android APK です。

            ## MeditDAW
            - パッケージ: `com.medit.midi`
            - ファイル: `${{ steps.artifact.outputs.app_name }}
            - 対応バージョン: Android 8.0 (API 26) 以上
            - 署名: ${{ steps.artifact.outputs.app_signed == 'debug' && 'デバッグ署名（テスト用）' || 'リリース署名（v1 / v2 / v3）' }}

            インストール:

            ```bash
            adb install -r ${{ steps.artifact.outputs.app_apk }}
            ```

            - SHA-256 は同名の `.sha256` ファイルにあります。
