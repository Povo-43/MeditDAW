name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.keystore"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace -x test

      - name: Verify APK integrity (MeditDAW)
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/34.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "${APK}"
          "${BUILD_TOOLS}/zipalign" -c 4 "${APK}"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | tee /dev/stderr | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          test -n "$(unzip -l "${APK}" | awk '/META-INF\/MANIFEST.MF/')"
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
          echo "${BADGING}" | head -3
          echo "${BADGING}" | grep -q "^package: name='com.medit.daw'"

      - name: Prepare release artifacts
        id: artifact
        run: |
          set -euo pipefail
          APP_VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          APP_NAME="MeditDAW-${APP_VERSION_NAME}-${SUFFIX}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APP_NAME}"
          (cd dist && sha256sum "${APP_NAME}" > "${APP_NAME}.sha256")
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_apk=dist/${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_sha256=dist/${APP_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "Prepared ${APP_NAME}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            MeditDAW の Android APK です。

            ## MeditDAW
            - パッケージ: `com.medit.daw`
            - ファイル: `${{ steps.artifact.outputs.app_name }}
            - 対応バージョン: Android 8.0 (API 26) 以上
            - 署名: リリース署名（v1 / v2 / v3）
            - 複数トラックにそれぞれ別の SoundFont (.sf2) を割り当て可能

            インストール:

            ```bash
            adb install -r ${{ steps.artifact.outputs.app_apk }}
            ```

            - SHA-256 は同名の `.sha256` ファイルにあります。