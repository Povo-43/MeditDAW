name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "${SDK_ROOT}" ]]; then
            echo "ANDROID_HOME is not set on this runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "sdkmanager not found under ${SDK_ROOT}/cmdline-tools" >&2
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "RELEASE_STORE_FILE=${RUNNER_TEMP}/release.keystore"
            echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Unit tests (app + shared + daw)
        run: ./gradlew :app:testDebugUnitTest :shared:testDebugUnitTest :daw:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint (app + daw)
        run: ./gradlew :app:lintDebug :daw:lintDebug --no-daemon --stacktrace

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease :daw:assembleRelease --no-daemon --stacktrace

      - name: Verify APK integrity (Medit classic)
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/34.0.0"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "${APK}"
          "${BUILD_TOOLS}/zipalign" -c 4 "${APK}"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | tee /dev/stderr | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          test -n "$(unzip -l "${APK}" | awk '/META-INF\/MANIFEST.MF/')"
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
          echo "${BADGING}" | head -3
          echo "${BADGING}" | grep -q "^package: name='com.medit.midi'"

      - name: Verify APK integrity (MeditDAW)
        run: |
          set -euo pipefail
          BUILD_TOOLS="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools/34.0.0"
          APK=daw/build/outputs/apk/release/daw-release.apk
          test -f "${APK}"
          "${BUILD_TOOLS}/zipalign" -c 4 "${APK}"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | tee /dev/stderr | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          "${BUILD_TOOLS}/apksigner" verify --verbose "${APK}" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          test -n "$(unzip -l "${APK}" | awk '/META-INF\/MANIFEST.MF/')"
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${APK}")
          echo "${BADGING}" | head -3
          echo "${BADGING}" | grep -q "^package: name='com.medit.daw'"

      - name: Prepare release artifacts
        id: artifact
        run: |
          set -euo pipefail
          APP_VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          DAW_VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' daw/build.gradle.kts | head -1)
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            SUFFIX="${GITHUB_REF_NAME}"
          else
            SUFFIX="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          APP_NAME="Medit-${APP_VERSION_NAME}-${SUFFIX}.apk"
          DAW_NAME="MeditDAW-${DAW_VERSION_NAME}-${SUFFIX}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/${APP_NAME}"
          cp daw/build/outputs/apk/release/daw-release.apk "dist/${DAW_NAME}"
          (cd dist && sha256sum "${APP_NAME}" > "${APP_NAME}.sha256")
          (cd dist && sha256sum "${DAW_NAME}" > "${DAW_NAME}.sha256")
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_apk=dist/${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_sha256=dist/${APP_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "daw_name=${DAW_NAME}" >> "$GITHUB_OUTPUT"
          echo "daw_apk=dist/${DAW_NAME}" >> "$GITHUB_OUTPUT"
          echo "daw_sha256=dist/${DAW_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "Prepared ${APP_NAME} and ${DAW_NAME}"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medit-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Medit / MeditDAW の Android APK です。

            ## Medit classic
            - パッケージ: `com.medit.midi`
            - ファイル: `${{ steps.artifact.outputs.app_name }}
            - 対応バージョン: Android 8.0 (API 26) 以上
            - 署名: リリース署名（v1 / v2 / v3）

            ## MeditDAW（複数トラック対応）
            - パッケージ: `com.medit.daw`
            - ファイル: `${{ steps.artifact.outputs.daw_name }}
            - 複数トラックにそれぞれ別の SoundFont (.sf2) を割り当て可能
            - 対応バージョン: Android 8.0 (API 26) 以上
            - 署名: リリース署名（v1 / v2 / v3）

            インストール:

            ```bash
            adb install -r ${{ steps.artifact.outputs.app_apk }}
            adb install -r ${{ steps.artifact.outputs.daw_apk }}
            ```

            - 別のパッケージ名なので、Medit classic と MeditDAW は同じ端末に共存できます。
            - SHA-256 は同名の `.sha256` ファイルにあります。
